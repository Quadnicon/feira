/* dashboard */
function dlt(c,p,good=1){if(!rng()||!(p>0))return'';const v=(c-p)/p*100,up=v>=0,ok=up==!!good;return`<span class="dl ${ok?'up':'dn'}">${ic(up?'up':'down')}${Math.abs(v).toFixed(1).replace('.',',')}% vs. período anterior</span>`}
function dash(){const t=tot(pm()),p=tot(pm(1));
 const k=(l,v,i,cl,d,ctx)=>`<div class="c k"><div class="h">${l}<span class="i ${cl}">${ic(i)}</span></div><b>${v}</b>${d||''}<small>${ctx}</small></div>`;
 return`<p class="sub">Visão geral das finanças da feira no período escolhido.</p><div class="grid">
 ${k('Saldo disponível',R(t.rec-t.pag),'wal','',dlt(t.rec-t.pag,p.rec-p.pag),'Recebido menos pago')}
 ${k('Recebimentos',R(t.rec),'up','',dlt(t.rec,p.rec),'Valores já recebidos')}
 ${k('Pagamentos',R(t.pag),'down','r',dlt(t.pag,p.pag,0),'Valores já pagos')}
 ${k('A receber',R(t.rp),'clk','w','','Recebimentos pendentes')}
 ${k('A pagar',R(t.pp),'clk','w','','Pagamentos pendentes e atrasados')}
 ${k('Transações',t.n,'list','b',dlt(t.n,p.n),'Lançamentos no período')}</div>
 ${t.n?`<div class="charts"><div class="c"><h3>Receitas e despesas</h3><div class="cv"><canvas id="c1"></canvas></div></div><div class="c"><h3>Evolução do saldo</h3><div class="cv"><canvas id="c2"></canvas></div></div><div class="c"><h3>Gastos por categoria</h3><div class="cv"><canvas id="c3"></canvas></div></div></div>`:empty('Nada neste período','Escolha outro período ou registre uma nova movimentação.')}`}
function empty(t,s){return`<div class="empty">${ic('list')}<div><b>${t}</b></div><div>${s}</div></div>`}
function charts(){if(!window.Chart||!$('#c1'))return;const cs=getComputedStyle(document.body),mu=cs.getPropertyValue('--mu').trim();Chart.defaults.color=mu;Chart.defaults.borderColor=cs.getPropertyValue('--bd').trim();Chart.defaults.font.family='Manrope,system-ui,sans-serif';
 const M=pm(),t=tot(M),mk=(id,c)=>CH.push(new Chart($('#'+id),c));const op={responsive:true,maintainAspectRatio:false};
 mk('c1',{type:'bar',data:{labels:['Recebido','Pago','A receber','A pagar'],datasets:[{data:[t.rec,t.pag,t.rp,t.pp],backgroundColor:['#16A34A','#EF4444','#86EFAC','#F59E0B'],borderRadius:8}]},options:{...op,plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>R(x.parsed.y)}}}}});
 const ef=M.filter(m=>(m.tipo=='in'&&m.status=='recebido')||(m.tipo=='out'&&m.status=='pago')).sort((a,b)=>a.data<b.data?-1:1),by={};let s=0;ef.forEach(m=>{s+=m.tipo=='in'?m.valor:-m.valor;by[m.data]=s});
 mk('c2',{type:'line',data:{labels:Object.keys(by).map(D),datasets:[{label:'Saldo acumulado',data:Object.values(by),borderColor:'#16A34A',backgroundColor:'#16A34A22',fill:true,tension:.3,pointRadius:3}]},options:{...op,plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>R(x.parsed.y)}}}}});
 const cat={};M.filter(m=>m.tipo=='out'&&m.status=='pago').forEach(m=>cat[m.cat]=(cat[m.cat]||0)+m.valor);
 mk('c3',{type:'doughnut',data:{labels:Object.keys(cat),datasets:[{data:Object.values(cat),backgroundColor:['#166534','#16A34A','#4ADE80','#F59E0B','#EF4444','#2563EB','#94A3B8','#A3E635','#0EA5E9'],borderWidth:0}]},options:{...op,cutout:'62%',plugins:{legend:{position:'right',labels:{boxWidth:10}},tooltip:{callbacks:{label:x=>x.label+': '+R(x.parsed)}}}}})}
/* movimentações */
const PS=12;
function mov(){const o=a=>a.map(x=>`<option ${F.cat==x?'selected':''}>${esc(x)}</option>`).join('');
 return`<div class="bar"><select aria-label="Tipo" onchange="F.tipo=this.value;PG=1;drawTb()"><option value="">Todos os tipos</option><option value="in" ${F.tipo=='in'?'selected':''}>Recebimentos</option><option value="out" ${F.tipo=='out'?'selected':''}>Pagamentos</option></select>
 <select aria-label="Categoria" onchange="F.cat=this.value;PG=1;drawTb()"><option value="">Todas as categorias</option>${o([...new Set([...DB.cats.in,...DB.cats.out])])}</select>
 <input type="date" aria-label="De" value="${F.de}" onchange="F.de=this.value;PG=1;drawTb()"><input type="date" aria-label="Até" value="${F.ate}" onchange="F.ate=this.value;PG=1;drawTb()">
 <input type="search" placeholder="Buscar descrição ou responsável" value="${esc(F.q)}" oninput="F.q=this.value;PG=1;drawTb()" style="min-width:220px">
 <select aria-label="Ordenar" onchange="F.ord=this.value;drawTb()">${[['data-desc','Data: mais recente'],['data-asc','Data: mais antiga'],['valor-desc','Maior valor'],['valor-asc','Menor valor']].map(a=>`<option value="${a[0]}" ${F.ord==a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div><div class="c" id="tb"></div>`}
function drawTb(){const q=F.q.toLowerCase(),r=rng();let L=DB.movs.filter(m=>inR(m,r)&&(!F.tipo||m.tipo==F.tipo)&&(!F.cat||m.cat==F.cat)&&(!F.de||m.data>=F.de)&&(!F.ate||m.data<=F.ate)&&(!q||(m.desc+m.pessoa).toLowerCase().includes(q)));
 const[k,d]=F.ord.split('-');L.sort((a,b)=>(a[k]>b[k]?1:a[k]<b[k]?-1:0)*(d=='asc'?1:-1));const pages=Math.max(1,Math.ceil(L.length/PS));PG=Math.min(PG,pages);const V=L.slice((PG-1)*PS,PG*PS);
 $('#tb').innerHTML=L.length?`<div class="tw rt"><table><thead><tr><th>Data</th><th>Descrição</th><th>Responsável</th><th>Categoria</th><th>Forma</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${V.map(m=>`<tr style="cursor:pointer" onclick="det('${m.id}')"><td data-l="Data">${D(m.data)}</td><td data-l="Descrição">${esc(m.desc)}</td><td data-l="Responsável">${esc(m.pessoa)}</td><td data-l="Categoria"><span class="tag t-cat">${esc(m.cat)}</span></td><td data-l="Forma">${m.forma}</td><td data-l="Valor" class="${m.tipo=='in'?'g':'r'}"><b>${m.tipo=='in'?'+':'−'} ${R(m.valor)}</b></td><td data-l="Status">${tag(st(m))}</td><td onclick="event.stopPropagation()">${adm()?`<button class="btn s sm" onclick="formMov('${m.tipo}','${m.id}')" aria-label="Editar" title="Editar">${ic('edit')}</button> <button class="btn s sm" onclick="delMov('${m.id}')" aria-label="Excluir" title="Excluir">${ic('del')}</button>`:''}</td></tr>`).join('')}</tbody></table></div>
 <div class="pgn"><span>${L.length} lançamento(s)</span><button class="btn s sm" ${PG<2?'disabled':''} onclick="PG--;drawTb()">Anterior</button><span>${PG} de ${pages}</span><button class="btn s sm" ${PG>=pages?'disabled':''} onclick="PG++;drawTb()">Próxima</button></div>`:empty('Nenhum lançamento encontrado','Ajuste os filtros ou use “Nova movimentação”.')}
function det(id){const m=DB.movs.find(x=>x.id==id);openM(`<h2>${m.tipo=='in'?'Recebimento':'Pagamento'}: ${esc(m.desc)}</h2><p>${esc(m.pessoa)} · <b class="${m.tipo=='in'?'g':'r'}">${R(m.valor)}</b> ${tag(st(m))}</p><p class="sub">Categoria: ${esc(m.cat)} · Forma: ${m.forma}<br>${m.tipo=='out'?`Vencimento: ${D(m.venc)} · Pagamento: ${D(m.dataPgto)}`:`Data: ${D(m.data)}`}<br>Observações: ${esc(m.obs)||'-'}<br>Registrado por <b>${esc(m.user)}</b> em ${D(m.criado)}${m.editor?` · editado por ${esc(m.editor)}`:''}</p><button class="btn s" onclick="closeM()">Fechar</button>`)}
function delMov(id){if(!adm())return;ask('Excluir este lançamento? Essa ação não pode ser desfeita.',()=>{DB.movs=DB.movs.filter(m=>m.id!=id);save();render();toast('Lançamento excluído.')})}
function formMov(tipo,id){const m=DB.movs.find(x=>x.id==id)||{status:tipo=='in'?'recebido':'pago',forma:'PIX',data:T,venc:T};const op=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
 openM(`<h2>${id?'Editar':'Nova'} movimentação</h2>${id?'':`<div class="seg"><button class="${tipo=='in'?'on':''}" onclick="formMov('in')">Recebimento</button><button class="${tipo=='out'?'on':''}" onclick="formMov('out')">Pagamento</button></div>`}
 <div class="f"><label class="w">Descrição <em>*</em><input id="f_desc" value="${esc(m.desc)}"></label><label>${tipo=='in'?'Pagador ou responsável':'Beneficiário ou fornecedor'} <em>*</em><input id="f_pessoa" value="${esc(m.pessoa)}"></label><label>Valor (R$) <em>*</em><input id="f_valor" inputmode="decimal" placeholder="0,00" value="${m.valor!=null?String(m.valor).replace('.',','):''}"></label>
 ${tipo=='in'?`<label>Data <em>*</em><input id="f_data" type="date" value="${m.data}"></label>`:`<label>Vencimento <em>*</em><input id="f_venc" type="date" value="${m.venc||''}"></label><label>Data do pagamento<input id="f_pg" type="date" value="${m.dataPgto||''}"></label>`}
 <label>Categoria<select id="f_cat">${op(DB.cats[tipo],m.cat)}</select></label><label>Forma de pagamento<select id="f_forma">${op(FORMAS,m.forma)}</select></label><label>Status<select id="f_status">${op(tipo=='in'?['recebido','pendente']:['pago','pendente'],m.status)}</select></label><label class="w">Observações<textarea id="f_obs" rows="2">${esc(m.obs)}</textarea></label></div><div id="err" class="err" role="alert"></div><button class="btn" onclick="saveMov('${tipo}','${id||''}')">Salvar</button> <button class="btn s" onclick="closeM()">Cancelar</button>`)}
function saveMov(tipo,id){const g=k=>($('#f_'+k)?.value||'').trim();const o={desc:g('desc'),pessoa:g('pessoa'),valor:num(g('valor')),cat:g('cat'),forma:g('forma'),status:g('status'),obs:g('obs')};
 if(tipo=='in')o.data=g('data');else{o.venc=g('venc');o.dataPgto=g('pg');if(o.status=='pago'&&!o.dataPgto)o.dataPgto=T;if(o.status=='pendente')o.dataPgto='';o.data=o.dataPgto||o.venc}
 const bad=[];if(!o.desc)bad.push('f_desc');if(!o.pessoa)bad.push('f_pessoa');if(!(o.valor>0))bad.push('f_valor');if(!o.data)bad.push(tipo=='in'?'f_data':'f_venc');
 if(bad.length)return err('Preencha os campos obrigatórios. O valor deve ser maior que zero.',bad);
 if(DB.movs.some(m=>m.id!=id&&m.tipo==tipo&&m.desc==o.desc&&m.pessoa==o.pessoa&&m.valor==o.valor&&m.data==o.data))return err('Já existe um lançamento idêntico (mesma descrição, responsável, valor e data).',['f_desc','f_valor']);
 if(id)Object.assign(DB.movs.find(m=>m.id==id),o,{editor:me.login});else DB.movs.push({id:uid(),tipo,...o,user:me.login,criado:T});save();closeM();toast('Movimentação salva.')}
/* feiras */
function feiras(){const L=[...DB.feiras].sort((a,b)=>a.data<b.data?1:-1);
 return`<p class="sub">Selecione uma feira para registrar a presença e o pagamento de cada feirante.</p><div class="bar"><input type="date" id="nf" value="${T}" aria-label="Data da feira"><button class="btn" onclick="addFeira()">${ic('plus')}Nova feira</button></div>${L.length?`<div class="cards">${L.map(e=>{const M=DB.movs.filter(m=>m.feiraId==e.id),r=M.filter(m=>m.status=='recebido').reduce((a,m)=>a+m.valor,0),p=M.filter(m=>m.status=='pendente').reduce((a,m)=>a+m.valor,0);
 return`<div class="c" tabindex="0" onkeydown="if(event.key=='Enter')feiraDet('${e.id}')" onclick="feiraDet('${e.id}')"><b>${D(e.data)}</b> ${e.cancelada?'<span class="tag t-cancel">cancelada</span>':''}<div class="g"><b>${R(r)}</b> recebido</div><div class="o"><b>${R(p)}</b> pendente</div><small class="sub">${M.length} feirante(s) presente(s)</small></div>`}).join('')}</div>`:empty('Nenhuma feira cadastrada','Escolha uma data e use “Nova feira”.')}`}

function setFR(e,x){const s=$('#s_'+x).value,v=num($('#v_'+x).value)||0,p=$('#p_'+x).value,fe=DB.feiras.find(a=>a.id==e),fx=DB.feirantes.find(a=>a.id==x);let m=DB.movs.find(a=>a.feiraId==e&&a.feiranteId==x);
 if(s=='ausente')DB.movs=DB.movs.filter(a=>a!==m);else{if(!m){m={id:uid(),tipo:'in',feiraId:e,feiranteId:x,desc:'Taxa de feirante',cat:'Taxas de feirantes',obs:'',user:me.login,criado:T};DB.movs.push(m)}Object.assign(m,{pessoa:fx.nome,valor:v,data:fe.data,forma:p,status:s=='pago'?'recebido':'pendente'})}save();toast('Alteração salva.')}

/* relatórios */
function rel(){const M=pm(),liq=f=>M.filter(m=>m.forma==f&&((m.tipo=='in'&&m.status=='recebido')||(m.tipo=='out'&&m.status=='pago'))).reduce((a,m)=>a+(m.tipo=='in'?m.valor:-m.valor),0),t=tot(M);
 const pend=M.filter(m=>m.tipo=='in'&&m.status=='pendente'&&m.feiranteId).sort((a,b)=>a.data<b.data?1:-1),tp=pend.reduce((a,m)=>a+m.valor,0);
 const cat={};M.filter(m=>(m.tipo=='in'&&m.status=='recebido')||(m.tipo=='out'&&m.status=='pago')).forEach(m=>{const k=m.tipo+'|'+m.cat;cat[k]=(cat[k]||0)+m.valor});const k=(l,v,c)=>`<div class="c k"><div class="h">${l}</div><b class="${c}">${v}</b></div>`;
 return`<p class="sub">Prestação de contas do período escolhido.</p><div class="bar noprint"><button class="btn" onclick="print()">${ic('prt')}Imprimir ou salvar PDF</button><button class="btn s" onclick="exportXls()">${ic('dl')}Exportar planilha</button></div>
 <div class="grid">${k('Feiras realizadas',DB.feiras.filter(e=>!e.cancelada&&inR({data:e.data},rng())).length,'')}${k('Dinheiro (líquido)',R(liq('Dinheiro')),'g')}${k('PIX (líquido)',R(liq('PIX')),'bl')}${k('Saldo líquido',R(t.rec-t.pag),'g')}</div>
 <div class="c"><h3 style="margin-top:0">Pendentes para cobrança <span class="tag t-pendente" style="float:right">Total: ${R(tp)}</span></h3>${pend.length?`<div class="tw rt"><table><thead><tr><th>Feira</th><th>Feirante</th><th>Contato</th><th>Valor</th><th class="noprint">Cobrança</th></tr></thead><tbody>${pend.map(m=>{const x=DB.feirantes.find(a=>a.id==m.feiranteId),c=(x?.contato||'').replace(/\D/g,'');return`<tr><td data-l="Feira">${D(m.data)}</td><td data-l="Feirante">${esc(m.pessoa)}</td><td data-l="Contato">${esc(x?.contato)||'-'}</td><td data-l="Valor" class="r">${R(m.valor)}</td><td class="noprint">${c?`<a class="btn s sm" target="_blank" rel="noopener" href="https://wa.me/55${c}?text=${encodeURIComponent('Olá! Lembrete: taxa da Feira da Lua de '+D(m.data)+' ('+R(m.valor)+') pendente.')}">${ic('send')}WhatsApp</a>`:'<span class="sub">Sem telefone</span>'}</td></tr>`}).join('')}</tbody></table></div>`:empty('Sem pendências','Todas as taxas do período foram recebidas.')}</div>

function exportXls(){const rows=[['Tipo','Data','Descrição','Responsável','Categoria','Forma','Valor','Status','Usuário']].concat(pm().map(m=>[m.tipo=='in'?'Recebimento':'Pagamento',D(m.data),m.desc,m.pessoa,m.cat,m.forma,String(m.valor).replace('.',','),st(m),m.user]));
 const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='feira-da-lua.csv';a.click();toast('Planilha exportada.')}catch(e){toast('Não foi possível exportar neste ambiente.',1)}}
/* configurações */
function admP(){return`<p class="sub">Gerencie usuários e categorias.</p><div class="c"><h3 style="margin-top:0">Usuários</h3><div class="tw rt"><table><thead><tr><th>Nome</th><th>Login</th><th>Papel</th><th></th></tr></thead><tbody>${DB.users.map(u=>`<tr><td data-l="Nome">${esc(u.nome)}</td><td data-l="Login">${esc(u.login)}</td><td data-l="Papel"><span class="tag t-cat">${u.papel}</span></td><td>${u.id==me.id?'':`<button class="btn s sm" onclick="delU(${u.id})" aria-label="Remover">${ic('del')}</button>`}</td></tr>`).join('')}</tbody></table></div>
 <div class="bar" style="margin-top:12px"><input id="un" placeholder="Nome"><input id="ul" placeholder="Login"><input id="up" placeholder="Senha (mín. 6)"><select id="ur"><option value="operador">Operador</option><option value="admin">Administrador</option></select><button class="btn" onclick="addU()">${ic('plus')}Adicionar</button></div><div id="err" class="err" role="alert"></div></div>
 ${['in','out'].map(t=>`<div class="c" style="margin-top:14px"><h3 style="margin-top:0">Categorias de ${t=='in'?'recebimentos':'pagamentos'}</h3><div class="bar">${DB.cats[t].map((c,i)=>`<span class="tag t-${t=='in'?'ok':'out'}">${esc(c)} <a style="cursor:pointer" onclick="delC('${t}',${i})" aria-label="Remover ${esc(c)}">✕</a></span>`).join('')}</div><div class="bar"><input id="nc_${t}" placeholder="Nova categoria"><button class="btn sm" onclick="addC('${t}')">Adicionar</button></div></div>`).join('')}
 <div class="bar" style="margin-top:14px"><button class="btn d" onclick="ask('Apagar todos os dados e restaurar o exemplo? Essa ação não pode ser desfeita.',()=>{DB=seed();save();render();toast('Dados de exemplo restaurados.')},'Restaurar')">Restaurar dados de exemplo</button></div>`}
function addU(){const o={nome:$('#un').value.trim(),login:$('#ul').value.trim(),senha:$('#up').value,papel:$('#ur').value};if(!o.nome||!o.login||o.senha.length<6)return err('Preencha todos os campos. A senha precisa ter 6 ou mais caracteres.',['un','ul','up']);if(DB.users.some(u=>u.login==o.login))return err('Esse login já existe.',['ul']);DB.users.push({id:Date.now(),...o});save();render();toast('Usuário adicionado.')}
function delU(id){ask('Remover este usuário?',()=>{DB.users=DB.users.filter(u=>u.id!=id);save();render();toast('Usuário removido.')},'Remover')}
function addC(t){const v=$('#nc_'+t).value.trim();if(v&&!DB.cats[t].includes(v)){DB.cats[t].push(v);save();render();toast('Categoria adicionada.')}}
function delC(t,i){DB.cats[t].splice(i,1);save();render();toast('Categoria removida.')}
render();
</script>
